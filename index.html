<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Tracker">
<meta name="theme-color" content="#070B1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Money Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700;800&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Archivo+Black&family=Barlow:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600;700&family=Pirata+One&family=Spectral:wght@400;600;800&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Reenie+Beanie&display=swap">
<style>
/* Layout: sticky brand + pill nav, then a bold KPI band of four colour tiles, then cards in an auto-fit grid. */
:root{
  --bg:#F4F2FF; --surface:#FFFFFF; --surface-2:#ECE9FB; --ink:#17142E; --muted:#5F5A80; --line:#DDD8F3;
  --magenta:#E3226B; --amber:#F29A00; --teal:#0EA894; --violet:#5B3DF0;
  --good:#0B9467; --bad:#D9184F; --on-tile:#FFFFFF; --on-amber:#241500;
  --shadow:0 10px 30px -12px rgba(40,24,120,.25);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  /* text that sits on the page ground (not on cards), button colours, label face: themes can split these from --ink */
  --on-bg:var(--ink); --on-bg-muted:var(--muted); --btn-bg:var(--ink); --btn-fg:var(--bg); --f-label:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100E24; --surface:#1A1838; --surface-2:#252252; --ink:#F2F0FF; --muted:#A7A2CE; --line:#312D62;
  --magenta:#FF4D8D; --amber:#FFB627; --teal:#22D3B6; --violet:#8B73FF;
  --good:#34D399; --bad:#FF5C8A; --shadow:0 12px 32px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100E24; --surface:#1A1838; --surface-2:#252252; --ink:#F2F0FF; --muted:#A7A2CE; --line:#312D62;
  --magenta:#FF4D8D; --amber:#FFB627; --teal:#22D3B6; --violet:#8B73FF;
  --good:#34D399; --bad:#FF5C8A; --shadow:0 12px 32px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--on-bg);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.18}
.glow i:nth-child(1){background:var(--magenta);top:-20vmax;left:-12vmax}
.glow i:nth-child(2){background:var(--violet);top:-16vmax;right:-18vmax}
.glow i:nth-child(3){background:var(--teal);bottom:-30vmax;left:30vw;opacity:.1}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:conic-gradient(from 210deg,var(--magenta),var(--amber),var(--teal),var(--violet),var(--magenta));color:#fff;font-size:17px}
.brand-r{display:flex;align-items:center;gap:8px}
.logo small{display:block;font-family:var(--f-label);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--on-bg-muted)}
.logo small:empty{display:none}
@media (max-width:440px){.status>span{display:none}.status{padding:8px}}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:99px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--good)} .status.busy i{background:var(--amber);animation:pulse 1s infinite} .status.local i{background:var(--amber)}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--on-bg-muted);font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--btn-bg);color:var(--btn-fg)}

main{padding-block:22px 80px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.4vw,36px);letter-spacing:-.02em;line-height:1.1}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.eyebrow{font-family:var(--f-label);font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.head{color:var(--on-bg)} .head .eyebrow,.head .lede,.view>.hint{color:var(--on-bg-muted)}
.card,.level,.item,.line-item,.tscroll,.banner,.guide button,.panel{color:var(--ink)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-weight:800;font-size:14px;padding:11px 18px;border-radius:99px;background:var(--btn-bg);color:var(--btn-fg);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:7px 13px;font-size:13px}

/* example banner */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--amber) 16%,var(--surface)) 0 14px,color-mix(in srgb,var(--amber) 9%,var(--surface)) 14px 28px);border:1.5px dashed var(--amber)}
.banner p{margin:0;font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:var(--on-tile);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:var(--shadow);transition:transform .25s}
.tile:hover{transform:translateY(-3px) rotate(-.3deg)}
.tile::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.16)}
.tile .eyebrow{color:inherit;opacity:.85}
.tile .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.3vw,36px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13.5px;font-weight:600;opacity:.92}
.t1{background:linear-gradient(135deg,var(--magenta),#FF7A45)}
.t2{background:linear-gradient(135deg,var(--violet),#C64BD9)}
.t3{background:linear-gradient(135deg,#0B8F8A,var(--teal))}
.t4{background:linear-gradient(135deg,var(--amber),#FFD34D);color:var(--on-amber)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tile{min-height:128px;padding:15px}.tile .big{font-size:24px}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);font-weight:500}
.row strong{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.row.hl strong{font-size:18px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--amber) 22%,transparent);color:color-mix(in srgb,var(--amber) 60%,var(--ink))}
.chip.vio{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.chart-box{position:relative;height:250px}
.chart-box.sm{height:200px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
@media (max-width:420px){.split{grid-template-columns:1fr}}

/* milestones */
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.level{border-radius:var(--r);padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.level.won{border-color:var(--amber);background:linear-gradient(160deg,color-mix(in srgb,var(--amber) 20%,var(--surface)),var(--surface))}
.level .reward{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
.level .reward em{font-style:normal;font-size:28px}
.bar{height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p);border-radius:inherit;background:linear-gradient(90deg,var(--magenta),var(--amber));animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.6s 1.1s infinite;transform:translateX(-100%)}
@keyframes grow{from{width:0}}
@keyframes shine{to{transform:translateX(100%)}}
.level .meta{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;gap:10px;flex-wrap:wrap}
.best{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline}
.best .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;background:linear-gradient(90deg,var(--magenta),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}

/* lists */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.item{text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,border-color .18s,box-shadow .18s}
.item:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:var(--shadow)}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-h b{font-size:16.5px;font-weight:800}
.biz{display:flex;flex-direction:column;gap:1px;font-size:13.5px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.biz .where{font-weight:500}
/* phone client list: compact rows that open in place */
.clist{display:flex;flex-direction:column;gap:8px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.crow.open{border-color:var(--violet);box-shadow:var(--shadow)}
.crow-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;padding:10px 14px;cursor:pointer;font:inherit}
.cav{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;flex:none;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 40) 70% 42%));transition:width .25s,height .25s,font-size .25s}
.crow.open .cav{width:58px;height:58px;font-size:19px}
.cdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--good)}
.cdot.warn{background:var(--amber)} .cdot.bad{background:var(--bad)}
.cmain{display:flex;flex-direction:column;min-width:0}
.cmain b{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmain small,.camt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camt{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.camt b{font-size:15.5px;font-weight:800}
.cbody{display:flex;flex-direction:column;gap:12px;padding:2px 14px 14px;animation:viewIn .25s ease both}
.cbody-h{display:flex;flex-direction:column;gap:8px}
.cbody .btn{align-self:flex-start}
details.more{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--violet);padding:4px 0}
details.more .fgrid{margin-top:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv span{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.line-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .18s,transform .18s}
.line-item:hover{border-color:var(--violet);transform:translateX(2px)}
.date-badge{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:var(--surface-2);line-height:1;text-align:center}
.date-badge b{font-family:var(--f-display);font-size:16px}
.date-badge small{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.line-item .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.line-item .what b{overflow-wrap:anywhere}
.line-item .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.stack{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;text-align:right;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
tr.next td{background:color-mix(in srgb,var(--violet) 10%,transparent)}
tr.future td{color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td input{width:110px;text-align:right;padding:6px 8px;border-radius:9px;border:1.5px solid color-mix(in srgb,var(--violet) 45%,var(--line));background:color-mix(in srgb,var(--violet) 7%,var(--surface));font-variant-numeric:tabular-nums;color:var(--violet);font-weight:700}
td input:disabled{opacity:.5}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:800;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--violet);font-weight:700;min-width:0}
.field input:focus,.field select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent)}
.field small{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:460px){.fgrid{grid-template-columns:1fr}}
.typein{color:var(--violet);font-weight:800}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,30,.45);backdrop-filter:blur(3px);animation:fade .2s both}
.sheet .panel{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:rise .28s cubic-bezier(.2,.8,.2,1) both;border:1px solid var(--line)}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:24px}}
.panel-f{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--bad);font-weight:700;font-size:13px;margin:0}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:99px;font-weight:700;z-index:60;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.guide button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;cursor:pointer;transition:border-color .18s}
.guide button:hover{border-color:var(--violet)}
.guide b{font-size:14px} .guide span{font-size:12.5px;color:var(--muted)}
.empty{padding:26px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
.loading{display:grid;gap:14px}
.loading div{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.view{animation:viewIn .35s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:22px}
@keyframes viewIn{from{opacity:.001;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- theme picker ---------- */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.skin-opt{position:relative;text-align:left;cursor:pointer;border-radius:16px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border:2px solid transparent;overflow:hidden;transition:transform .2s,border-color .2s}
.skin-opt:hover{transform:translateY(-3px)}

/* ================= phone app shell (all themes) ================= */
*{-webkit-tap-highlight-color:transparent}
button,a,input,select{touch-action:manipulation}
.bnav,.handle{display:none}
.fab{display:none}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcard.next{box-shadow:0 0 0 2px var(--violet),var(--shadow)}
.pcard.future{opacity:.88}
.pdate{font-size:17px}
.pin{margin-top:2px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer}
.menu button[aria-current="page"]{border-color:var(--violet)}
.menu .bic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.menu svg{width:22px;height:22px}
.menu small{color:var(--muted);font-size:12.5px}
.sheet-open body{overflow:hidden}
.auth{max-width:440px;width:100%;margin:6vh auto 0;gap:18px}
.signed-out nav.tabs,.signed-out .bnav,.signed-out .fab,.signed-out #skinBtn{display:none!important}
/* app lock: full-screen passcode pad */
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);color:var(--on-bg);
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden;transform:none}
#lock[hidden]{display:none}
.locked body{overflow:hidden}
.lock-top{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lock-top .logo b{width:56px;height:56px;border-radius:16px;font-size:26px}
.lock-top h2{font-size:18px}
.pdots{display:flex;gap:18px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;transition:background .15s}
.pdots i.f{background:currentColor}
.pdots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lock-msg{min-height:1.4em;color:var(--on-bg-muted);font-weight:600;text-align:center;max-width:280px}

<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><b>$</b><div>Money Tracker<small id="tagline"></small></div></div>
      <div class="brand-r"><span id="status" class="status"><i></i><span>Connecting…</span></span><button class="btn sm ghost" id="skinBtn" data-skins>Theme</button></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<div class="wrap"><main id="main"><div class="loading"><div></div><div></div></div></main></div>

<button class="fab" id="fab" aria-label="Add" hidden></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============ date + number helpers (dates are Excel-style day serials so the maths matches the workbook) ============ */
const DAY = 86400000, NONE = 99999;
const mk = (y, m, d) => Date.UTC(y, m - 1, d) / DAY + 25569;
const ser = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return d ? mk(y, m, d) : (m ? mk(y, m, 1) : null); };
const ymd = s => { const t = new Date((s - 25569) * DAY); return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()]; };
const isoOf = s => new Date((s - 25569) * DAY).toISOString().slice(0, 10);
const edate = (s, n) => { const [y, m, d] = ymd(s); const t = m - 1 + n, yy = y + Math.floor(t / 12), mm = ((t % 12) + 12) % 12 + 1; return mk(yy, mm, Math.min(d, ymd(mk(yy, mm + 1, 0))[2])); };
const eomonth = s => { const [y, m] = ymd(s); return mk(y, m + 1, 0); };
const todaySerial = () => { const n = new Date(); return mk(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const blank = v => v === null || v === undefined || v === '';
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $0 = n => (n < -0.0049 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const $2 = n => (n < -0.0049 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (n, d = 0) => (n * 100).toFixed(d) + '%';
const dfmt = (s, o) => s == null ? '—' : new Date((s - 25569) * DAY).toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const dShort = s => dfmt(s, { month: 'short', day: 'numeric' });
const dLong = s => dfmt(s, { month: 'short', day: 'numeric', year: 'numeric' });
const dMonth = s => dfmt(s, { month: 'short', year: 'numeric' });
const dMonthLong = s => dfmt(s, { month: 'long', year: 'numeric' });
const ordinal = d => d + ((d % 100 >= 11 && d % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[d % 10] || 'th'));
const $k = v => Math.abs(v) >= 1000 ? (v < 0 ? '-' : '') + '$' + (Math.abs(v) / 1000).toFixed(Math.abs(v) % 1000 ? 1 : 0) + 'k' : $0(v);

/* ============ settings + categories ============ */
const DEFAULTS = {
  commNew: 0.15, commRef: 0.20, commRecur: 0.15, cycle: 28, launchDelay: 28,
  firstPayday: '2026-10-15', taxRate: 0.30,
  milestones: [{ amount: 10000, reward: 'Level 1 reward', icon: '🎯' }, { amount: 30000, reward: 'Level 2 reward', icon: '🏆' }]
};
const CLIENT_TYPES = ['New', 'Referral', 'Upsell'];
const EXP_CATS = ['Equipment', 'Software', 'Ads/Marketing', 'Phone/Internet', 'Home office', 'Travel/Mileage', 'Education', 'Other', 'From old sheet'];

/* ============ the engine: every workbook formula, sheet by sheet ============ */
function compute(S, today) {
  const st = S.settings, cyc = num(st.cycle) || 28, tax = num(st.taxRate);
  const year = ymd(today)[0], jan1 = mk(year, 1, 1);

  // Clients!I:Q
  const clients = S.clients.map(c => {
    const p1 = num(c.p1), p2 = blank(c.p2) ? p1 : num(c.p2), p3 = blank(c.p3) ? p2 : num(c.p3);
    const signedS = ser(c.signed), launchS = ser(c.launch), cancelS = ser(c.cancel);
    const ref = c.type === 'Referral' || c.type === 'Upsell';
    const I = blank(c.p1) ? 0 : p1 * (ref ? st.commRef : st.commNew);
    const J = p2 * st.commRecur, K = p3 * st.commRecur;
    const P = cancelS ?? NONE, Q = launchS != null ? launchS + num(st.launchDelay) : NONE;
    let next;
    if (launchS == null) next = 'Add launch date';
    else { const n = today <= Q ? Q : Q + cyc * Math.ceil((today - Q) / cyc); next = n < P ? n : 'Cancelled'; }
    const N = launchS == null ? 0 : Math.max(0, Math.floor((Math.min(today, P - 1) - Q) / cyc) + 1);
    const O = I + (N >= 1 ? J + (N - 1) * K : 0);
    return { ...c, p1, p2, p3, signedS, launchS, cancelS, I, J, K, P, Q, L: launchS == null ? null : Q, next, N, O, active: P > today };
  });

  const expenses = S.expenses.map(e => ({ ...e, s: ser(e.date), amt: num(e.amount) }));
  const others = S.others.map(o => ({ ...o, s: ser(o.date), amt: num(o.amount) }));
  const expBetween = (a, b) => sum(expenses.filter(e => e.s != null && e.s >= a && e.s <= b), e => e.amt);

  // Paydays sheet
  const first = ser(st.firstPayday) ?? mk(year, 1, 15);
  const monthsToToday = (ymd(today)[0] - ymd(first)[0]) * 12 + ymd(today)[1] - ymd(first)[1];
  const nPay = Math.max(80, monthsToToday + 14);
  const cnt = (t, c) => { const cap = t < c.P ? t : c.P - 1; return cap >= c.Q ? Math.floor((cap - c.Q) / cyc) + 1 : 0; };
  const paydays = [];
  for (let i = 0; i < nPay; i++) {
    const C = edate(first, i), B = edate(C, -1) + 1;
    const D = sum(clients.filter(c => c.signedS != null && c.signedS >= B && c.signedS <= C), c => c.I);
    const E = sum(clients, c => (cnt(C, c) - cnt(B - 1, c)) * c.K + (c.Q >= B && c.Q <= C && c.Q < c.P ? c.J - c.K : 0));
    const F = sum(others.filter(o => o.s != null && o.s >= B && o.s <= C), o => o.amt);
    const inp = S.paydays[isoOf(C)] || {};
    const H = blank(inp.received) ? null : num(inp.received);
    const moved = blank(inp.moved) ? null : num(inp.moved);
    paydays.push({ i: i + 1, B, C, D, E, F, G: D + E + F, H, moved, owe: C >= today ? null : D + E + F - (H || 0) });
  }
  paydays.forEach(p => {
    const y1 = mk(ymd(p.C)[0], 1, 1);
    const ytdG = sum(paydays.filter(q => q.C >= y1 && q.C <= p.C), q => q.G);
    const ytdE = expBetween(y1, p.C);
    p.taxPut = tax * (Math.max(0, ytdG - ytdE) - Math.max(0, ytdG - p.G - ytdE));
  });

  // Business P&L months
  const monthStart = s => { const [y, m] = ymd(s); return mk(y, m, 1); };
  const marks = [monthStart(today), ...expenses.filter(e => e.s != null).map(e => monthStart(e.s)),
    ...paydays.filter(p => p.H != null).map(p => monthStart(p.C))];
  let mStart = Math.min(...marks), mEnd = Math.max(mk(year, 12, 1), ...marks);
  const months = [];
  for (let m = mStart; m <= mEnd; m = edate(m, 1)) {
    const end = eomonth(m);
    const inc = sum(paydays.filter(p => p.C >= m && p.C <= end), p => p.H || 0);
    const ex = expBetween(m, end);
    months.push({ m, inc, ex, profit: inc - ex });
  }
  months.forEach(r => {
    const y1 = mk(ymd(r.m)[0], 1, 1);
    r.ytd = sum(months.filter(q => q.m >= y1 && q.m <= r.m), q => q.profit);
    r.takeHome = r.profit - Math.max(0, r.profit) * tax;
  });
  const years = [...new Set(months.map(r => ymd(r.m)[0]))].map(y => {
    const rs = months.filter(r => ymd(r.m)[0] === y);
    const inc = sum(rs, r => r.inc), ex = sum(rs, r => r.ex), profit = inc - ex;
    return { y, inc, ex, profit, set: Math.max(0, profit) * tax };
  });

  // Net Worth sheet
  const nwRows = S.nw.map(n => {
    const filled = ['checking', 'mm', 'invest', 'fun'].some(k => !blank(n[k]));
    const cash = num(n.checking) + num(n.mm), inv = num(n.invest) + num(n.fun);
    return { ...n, s: ser(n.month), filled, cash, inv, total: cash + inv };
  }).sort((a, b) => a.s - b.s);
  nwRows.forEach(r => {
    const prev = nwRows.find(q => q.s === edate(r.s, -1));
    r.change = r.filled && prev && prev.filled ? r.total - prev.total : null;
    r.changePct = r.change != null && prev.total !== 0 ? r.change / prev.total : null;
    r.cashPct = r.filled && r.total !== 0 ? r.cash / r.total : null;
  });
  const nwLatest = [...nwRows].reverse().find(r => r.filled) || null;

  // Milestones sheet
  const takeMax = months.length ? Math.max(...months.map(r => r.takeHome)) : 0;
  const best = Math.max(0, takeMax);
  const bestMonth = best === 0 ? null : months.find(r => r.takeHome === takeMax).m;
  const levels = (st.milestones || []).map(l => {
    const goal = num(l.amount), frac = goal > 0 ? Math.min(1, best / goal) : 0, won = goal > 0 && best >= goal;
    const wonAt = won ? Math.min(...months.filter(r => r.takeHome >= goal).map(r => r.m)) : null;
    return { ...l, goal, frac, won, wonAt, toGo: goal - best };
  });

  // Settings!B14 helper + Dashboard
  const nextIdx = paydays.filter(p => p.C <= today - 1).length;
  const next = paydays[nextIdx] || null;
  const ytdMonths = months.filter(r => r.m >= jan1 && r.m <= today);
  const income = sum(ytdMonths, r => r.inc), costs = sum(ytdMonths, r => r.ex), profit = income - costs;
  const shouldTax = Math.max(0, profit) * tax;
  const movedTax = sum(paydays.filter(p => p.C >= jan1 && p.C <= today), p => p.moved || 0);
  const named = clients.filter(c => !blank(c.name));
  const every4 = sum(named.filter(c => c.P > today), c => c.K);
  const dash = {
    next, owed: sum(paydays, p => p.owe || 0),
    income, costs, profit, shouldTax, movedTax, shortfall: Math.max(0, shouldTax - movedTax),
    signed: named.length, waiting: named.filter(c => c.launchS == null).length,
    every4, perYear: every4 * 365 / cyc, earned: sum(clients, c => c.O)
  };
  return { clients, expenses, others, paydays, nextIdx, months, years, nwRows, nwLatest, best, bestMonth, levels, dash, today };
}

/* ============ example data (only while the person's log is empty) ============ */
function examples(st) {
  const f = ser(st.firstPayday) ?? todaySerial(), d = n => isoOf(f + n);
  const mStart = n => { const [y, m] = ymd(edate(f, n)); return isoOf(mk(y, m, 1)); };
  return {
    clients: [
      { id: 'ex1', n: 1, signed: d(-12), name: 'Example: Dana Ruiz', business: 'Harbor Dental', city: 'Madison', state: 'WI', type: 'New', p1: 3000, launch: d(-8) },
      { id: 'ex2', n: 2, signed: d(-4), name: 'Example: Mark Olsen', business: 'Peak Roofing', city: 'Denver', state: 'CO', type: 'Referral', p1: 3500, p2: 3500, p3: 4000, launch: d(2) },
      { id: 'ex3', n: 3, signed: d(9), name: 'Example: Priya Shah', business: 'Lumen Yoga', city: 'Austin', state: 'TX', type: 'New', p1: 2500 }
    ],
    expenses: [
      { id: 'ex4', date: d(-30), what: 'Example: CRM subscription', category: 'Software', amount: 49 },
      { id: 'ex5', date: d(-2), what: 'Example: headset', category: 'Equipment', amount: 120 }
    ],
    others: [{ id: 'ex6', date: d(-1), desc: 'Example: launch bonus', amount: 250 }],
    nw: [
      { id: 'ex7', month: mStart(-3), checking: 2100, mm: 500, invest: 9000, fun: 300 },
      { id: 'ex8', month: mStart(-2), checking: 1800, mm: 900, invest: 9400, fun: 260 },
      { id: 'ex9', month: mStart(-1), checking: 2600, mm: 1300, invest: 9650, fun: 310 }
    ],
    paydays: { [d(0)]: { received: 700 } }
  };
}

/* ============ themes ============ */
const SKINS = [
  { id: 'original', name: 'Original', tag: '', blurb: 'Bold colour, light or dark', font: 'Unbounded', bg: 'linear-gradient(135deg,#5B3DF0,#E3226B)', fg: '#fff', dots: ['#E3226B', '#F29A00', '#0EA894', '#5B3DF0'] },
  { id: 'me', name: 'Middle Earth', tag: 'Red Book of Accounts', blurb: 'Parchment, gold leaf, forest green', font: 'Cinzel', bg: 'radial-gradient(circle at 30% 20%,#F6EBCF,#D9C291)', fg: '#2B1D0E', dots: ['#2F5D3A', '#8C1C13', '#1F4E5F', '#B8860B'] },
  { id: 'bb', name: 'Breaking Bad', tag: 'Applied chemistry of cash', blurb: 'Lab green, element tiles, blue crystal', font: 'Archivo Black', bg: 'linear-gradient(160deg,#163021,#06120C)', fg: '#E6F2E4', dots: ['#4BC35C', '#3FD0F5', '#F2C230', '#E2622B'] },
  { id: 'bk', name: 'Berserk', tag: 'Ledger of the Struggler', blurb: 'Black iron, blood red, the eclipse', font: 'Pirata One', bg: 'radial-gradient(circle at 80% 25%,#000 0 18px,#D4261E 20px,rgba(179,18,27,.3) 34px,transparent 60px),#0d0a0a', fg: '#E9E1D6', dots: ['#B3121B', '#71808A', '#B08D3C', '#E9E1D6'] },
  { id: 'sv', name: 'Seven', tag: 'notebook no. 1,147', blurb: 'Typed, scrawled, under a desk lamp', font: 'Special Elite', bg: 'linear-gradient(#D9CEB2,#C8BB98)', fg: '#1C1812', dots: ['#6E140E', '#22305A', '#3E4A3A', '#1C1812'] }
];
const SKIN_FX = { bb: r => elementize(r) };
const LS_SKIN = 'moneyTracker.skin';
let currentSkin = 'original';
function setSkinAttr(id) {
  if (!SKINS.some(s => s.id === id)) id = 'original';
  currentSkin = id;
  if (id === 'original') document.documentElement.removeAttribute('data-skin'); else document.documentElement.setAttribute('data-skin', id);
  document.getElementById('tagline').textContent = SKINS.find(s => s.id === id).tag;
  try { localStorage.setItem(LS_SKIN, id); } catch {}
}
let pendingSkin = null;
function chooseSkin(id) {
  pendingSkin = id;
  const swap = () => { if (pendingSkin !== id) return; setSkinAttr(id); pendingSkin = null; if (S) render(); };
  if (mode !== 'loading' && !readOnly && S && S.settings.skin !== id) write('settings', { ...S.settings, skin: id });
  if (document.startViewTransition && document.visibilityState === 'visible' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    try { const vt = document.startViewTransition(swap); [vt.ready, vt.finished, vt.updateCallbackDone].forEach(p => p && p.catch(() => {})); } catch { swap(); }
    setTimeout(swap, 400);
  } else swap();
}
function skinOptions() {
  return `<div class="skins">${SKINS.map(s => `<button class="skin-opt" data-skin-pick="${s.id}" aria-pressed="${s.id === currentSkin}" style="background:${s.bg};color:${s.fg}">
    ${s.id === currentSkin ? '<span class="on">In use</span>' : ''}
    <div class="stack" style="gap:4px"><b style="font-family:'${s.font}',serif">${esc(s.name)}</b><span>${esc(s.blurb)}</span></div>
    <div class="dots">${s.dots.map(c => `<i style="background:${c}"></i>`).join('')}</div></button>`).join('')}</div>`;
}
function openSkins() {
  const sh = document.getElementById('sheet');
  editing = { kind: 'skins' };
  sh.innerHTML = `<div class="panel" role="dialog" aria-label="Choose a theme"><div class="handle" aria-hidden="true"></div><div class="card-h"><h2 style="font-size:18px">Choose a theme</h2><button type="button" class="btn ghost sm" data-close>Close</button></div>
    ${skinOptions()}<p class="hint">Same tracker, same numbers. Only the look changes, and your choice is remembered.</p></div>`;

function scheduleRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && a.matches('input,select')) { deferred = true; return; }
  if (renderQueued) return; renderQueued = true;
  const run = () => { if (!renderQueued) return; renderQueued = false; render(); };
  requestAnimationFrame(run); setTimeout(run, 80);
}
document.addEventListener('focusout', () => setTimeout(() => { if (deferred) { deferred = false; scheduleRender(); } }, 0));

function render() {
  const main = document.getElementById('main');
  if (mode === 'loading') return;
  if (mode === 'out') { if (lock.on) hideLock(); lock.ok = false; lastTab = null; main.innerHTML = `<div class="view">${vAuth()}</div>`; return; }
  syncLock();
  S = buildState(); R = compute(S, todaySerial());
  if (!pendingSkin && S.settings.skin && S.settings.skin !== currentSkin) setSkinAttr(S.settings.skin);
  const views = { home: vHome, clients: vClients, paydays: vPaydays, expenses: vExpenses, other: vOther, networth: vNetWorth, pl: vPL, milestones: vMilestones, settings: vSettings };
  const fresh = lastTab !== tab; lastTab = tab;
  const banner = S.example ? `<div class="banner"><p>These are example numbers so you can see how it works. Add your first client, expense or balance and they disappear.</p><div class="chips"><button class="btn sm ghost" data-import>Import backup</button><button class="btn sm" data-add="client">+ Add a client</button></div></div>` : '';
  main.innerHTML = `<div class="view" ${fresh ? '' : 'style="animation:none"'}>${banner}${views[tab]()}</div>`;
  if (SKIN_FX[currentSkin]) SKIN_FX[currentSkin](main);
  drawCharts();
  if (fresh) countUps();
}

function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function grad(hex) {

    const g = chart.ctx.createLinearGradient(0, a.bottom, 0, a.top);
    g.addColorStop(0, hex + '66'); g.addColorStop(1, hex); return g;
  };
}
function baseOpts(legend = true) {

}
function mkChart(id, cfg) {

  ] }, options: { ...baseOpts(), scales: { ...baseOpts().scales, x: { ...baseOpts().scales.x, stacked: true }, y: { ...baseOpts().scales.y, stacked: true } } } });
  const ms = R.months;

  ] }, options: { responsive: true, maintainAspectRatio: false, cutout: '64%', animation: { animateRotate: true, duration: 1000 },
    plugins: { legend: { display: tab !== 'home', position: 'bottom', labels: { color: tok('--muted'), usePointStyle: true, boxWidth: 8, font: { weight: 700 } } },
      tooltip: { backgroundColor: tok('--ink'), titleColor: tok('--surface'), bodyColor: tok('--surface'), callbacks: { label: c => ` ${c.label}: ${$2(c.parsed)}` } } } } });

function countUps() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 0) { panel.style.transform = `translateY(${dy}px)`; e.preventDefault(); } }, { passive: false });
  sh.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; panel.style.transition = 'transform .22s ease'; if (dy > 110) closeForm(); else panel.style.transform = ''; });
})();
function moneyVal(v) { const t = String(v ?? '').replace(/[$,\s]/g, ''); if (t === '') return null; const n = parseFloat(t); return isFinite(n) ? n : NaN; }
function submitForm(form) {
  const { kind, id } = editing, def = FORMS[kind], fd = new FormData(form), body = { kind };
  for (const [k, l, t, o = {}] of def.fields) {
    let v = fd.get(k);
    if (t === 'money') { v = moneyVal(v); if (Number.isNaN(v)) return formErr(`${l} needs to be a number.`); }
    else v = (v ?? '').toString().trim() || null;
    if (o.req && v == null) return formErr(`Please fill in ${l.toLowerCase()}.`);
    body[k] = v;
  }
  let docId = id;
  if (kind === 'client') { body.n = id ? (docs[id].n ?? Date.now()) : Date.now(); docId = id || newId('c'); }
  if (kind === 'expense') docId = id || newId('e');
  if (kind === 'other') docId = id || newId('o');
  if (kind === 'nw') {
    body.month = body.month + '-01'; docId = 'n-' + body.month.slice(0, 7);
    if (docId !== id && docs[docId]) return formErr(`You already have ${dMonthLong(ser(body.month))}. Edit that row instead.`);
    if (id && id !== docId) write(id, null);
  }
  write(docId, body);
  closeForm(); toast(id ? 'Saved' : 'Added');
}
function formErr(m) { const e = document.getElementById('ferr'); e.textContent = m; e.hidden = false; }

/* ============ events ============ */
function go(t) { tab = t; try { history.replaceState(null, '', '#' + t); } catch {} renderTabs(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
document.addEventListener('click', e => {
  const b = e.target.closest('button,tr[data-edit]'); if (!b) return;
  if (b.dataset.pin) return pressPin(b.dataset.pin);
  if (b.dataset.lock) {
    const k = b.dataset.lock;
    if (k === 'set') return showLock('set1');
    if (k === 'change' || k === 'off') return showLock(k);
    if (k === 'faceon') return enrollFaceId();
    if (k === 'faceoff') { lsRaw(LS_FACE, null); toast('Face ID off for this device'); return render(); }
  }
  if (b.dataset.auth) return doAuth(b.dataset.auth);
  if (b.hasAttribute('data-export')) return exportBackup();
  if (b.hasAttribute('data-import')) return document.getElementById('importFile').click();
  if (b.hasAttribute('data-signout')) { closeForm(); tab = 'home'; renderTabs(); return firebase.auth().signOut(); }
  if (b.dataset.toggleClient) {
    const id = b.dataset.toggleClient; openClient = openClient === id ? null : id; render();
    if (openClient) document.getElementById('crow-' + id)?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  if (b.dataset.tab) return go(b.dataset.tab);
  if (b.dataset.bnav) return b.dataset.bnav === 'more' ? openMore() : go(b.dataset.bnav);
  if (b.id === 'fab') return b.dataset.fab === 'quick' ? openQuick() : openForm(b.dataset.fab);
  if (b.dataset.menu) { const [a, k] = b.dataset.menu.split(':'); closeForm(); if (a === 'go') return go(k); if (a === 'add') return openForm(k); if (a === 'skins') return openSkins(); return; }
  if (b.hasAttribute('data-skins')) return openSkins();
  if (b.dataset.skinPick) { const inSheet = !!b.closest('#sheet'); if (inSheet) closeForm(); return chooseSkin(b.dataset.skinPick); }
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.guide) { const g = b.dataset.guide; if (g === 'client' || g === 'expense' || g === 'nw') return openForm(g); if (g === 'other-add') return openForm('other'); return go(g); }
  if (b.dataset.add) return openForm(b.dataset.add);
  if (b.dataset.edit) return openForm(b.dataset.edit, b.dataset.id);
  if (b.hasAttribute('data-close')) return closeForm();
  if (b.hasAttribute('data-toggle-pay')) { showAllPaydays = !showAllPaydays; return render(); }
  if (b.hasAttribute('data-del')) {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to delete'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Delete'; }, 3500); return; }
    const id = editing.id; write(id, null); closeForm(); toast('Deleted');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editing) closeForm();
  if (e.key === 'Enter' && e.target.matches('tr[data-edit]')) openForm(e.target.dataset.edit, e.target.dataset.id);
});
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeForm(); });
document.addEventListener('submit', e => {
  if (e.target.id === 'form') { e.preventDefault(); submitForm(e.target); }
  if (e.target.id === 'authform') { e.preventDefault(); doAuth('in'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pay) {
    const date = t.dataset.pay, id = 'p-' + date, cur = docs[id] || { kind: 'payday', date };
    const v = moneyVal(t.value); if (Number.isNaN(v)) { toast('Type a number, like 2525'); t.value = cur[t.dataset.field] ?? ''; return; }
    const body = { ...cur, kind: 'payday', date, [t.dataset.field]: v };
    write(id, body.received == null && body.moved == null ? null : body);
  }
  if (t.dataset.set) {
    const k = t.dataset.set, f = SETTINGS_FIELDS.find(x => x[0] === k);
    let v = f[2] === 'date' ? t.value : moneyVal(t.value);
    if (v == null || v === '' || Number.isNaN(v)) { toast('That setting needs a value.'); return scheduleRender(); }
    if (f[2] === '%') v = v / 100;
    write('settings', { ...S.settings, [k]: v });
  }
  if (t.dataset.ms) {
    const i = +t.dataset.ms, k = t.dataset.k, ms = S.settings.milestones.map(x => ({ ...x }));
    let v = t.value; if (k === 'amount') { v = moneyVal(v); if (v == null || Number.isNaN(v)) { toast('Type an amount, like 10000'); return scheduleRender(); } }
    ms[i][k] = v; write('settings', { ...S.settings, milestones: ms });
  }
});
let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
window.__moneyTracker = { compute, ser, isoOf };
boot();
